name: CI

on:
  push:
    branches: ["main", "foundation/**", "implementation/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node --check server.js
      - run: node --check app.js
      - run: find api src -name '*.js' -print0 | xargs -0 -n1 node --check
